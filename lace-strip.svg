<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80" width="64" height="80">
  <!-- Seamless vertical tile: blush satin backing with white scalloped lace. Repeats on Y. -->
  <defs>
    <linearGradient id="back" x1="0" x2="1">
      <stop offset="0" stop-color="#DDB0BD"/>
      <stop offset=".5" stop-color="#E8C2CD"/>
      <stop offset="1" stop-color="#DDB0BD"/>
    </linearGradient>
    <pattern id="net" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0H4M0 0V4" stroke="#FFFFFF" stroke-width=".55" opacity=".75"/>
    </pattern>
    <g id="flower">
      <g fill="#FFFFFF">
        <ellipse cx="0" cy="-5.2" rx="2.6" ry="4"/>
        <ellipse cx="0" cy="-5.2" rx="2.6" ry="4" transform="rotate(60)"/>
        <ellipse cx="0" cy="-5.2" rx="2.6" ry="4" transform="rotate(120)"/>
        <ellipse cx="0" cy="-5.2" rx="2.6" ry="4" transform="rotate(180)"/>
        <ellipse cx="0" cy="-5.2" rx="2.6" ry="4" transform="rotate(240)"/>
        <ellipse cx="0" cy="-5.2" rx="2.6" ry="4" transform="rotate(300)"/>
      </g>
      <circle r="2.4" fill="#EDCFD7" stroke="#FFFFFF" stroke-width="1.1"/>
      <circle r=".8" fill="#FFFFFF"/>
    </g>
    <g id="bud">
      <circle r="2.2" fill="#FFFFFF"/>
      <circle cx="-3.4" cy="0" r="1.2" fill="#FFFFFF"/>
      <circle cx="3.4" cy="0" r="1.2" fill="#FFFFFF"/>
      <circle cx="0" cy="-3.4" r="1.2" fill="#FFFFFF"/>
      <circle cx="0" cy="3.4" r="1.2" fill="#FFFFFF"/>
    </g>
  </defs>
  <rect width="64" height="80" fill="url(#back)"/>
  <!-- lace body with scalloped edges both sides (scallops at y = 0, 20, 40, 60, 80 keep the tile seamless) -->
  <g>
    <rect x="15" y="0" width="34" height="80" fill="#FFFFFF" opacity=".42"/>
    <rect x="15" y="0" width="34" height="80" fill="url(#net)"/>
    <g fill="#FFFFFF" opacity=".5">
      <circle cx="15" cy="10" r="8"/><circle cx="15" cy="30" r="8"/><circle cx="15" cy="50" r="8"/><circle cx="15" cy="70" r="8"/>
      <circle cx="49" cy="10" r="8"/><circle cx="49" cy="30" r="8"/><circle cx="49" cy="50" r="8"/><circle cx="49" cy="70" r="8"/>
    </g>
    <g fill="none" stroke="#FFFFFF" stroke-width="1.3">
      <path d="M15 0 A10 10 0 0 0 15 20 A10 10 0 0 0 15 40 A10 10 0 0 0 15 60 A10 10 0 0 0 15 80"/>
      <path d="M49 0 A10 10 0 0 1 49 20 A10 10 0 0 1 49 40 A10 10 0 0 1 49 60 A10 10 0 0 1 49 80"/>
      <path d="M17.5 0 A7.5 7.5 0 0 0 17.5 20 A7.5 7.5 0 0 0 17.5 40 A7.5 7.5 0 0 0 17.5 60 A7.5 7.5 0 0 0 17.5 80" stroke-width=".7" opacity=".85"/>
      <path d="M46.5 0 A7.5 7.5 0 0 1 46.5 20 A7.5 7.5 0 0 1 46.5 40 A7.5 7.5 0 0 1 46.5 60 A7.5 7.5 0 0 1 46.5 80" stroke-width=".7" opacity=".85"/>
    </g>
    <!-- picot dots on scallop edges -->
    <g fill="#FFFFFF">
      <circle cx="5.4" cy="10" r="1"/><circle cx="7.4" cy="4" r=".9"/><circle cx="7.4" cy="16" r=".9"/>
      <circle cx="5.4" cy="30" r="1"/><circle cx="7.4" cy="24" r=".9"/><circle cx="7.4" cy="36" r=".9"/>
      <circle cx="5.4" cy="50" r="1"/><circle cx="7.4" cy="44" r=".9"/><circle cx="7.4" cy="56" r=".9"/>
      <circle cx="5.4" cy="70" r="1"/><circle cx="7.4" cy="64" r=".9"/><circle cx="7.4" cy="76" r=".9"/>
      <circle cx="58.6" cy="10" r="1"/><circle cx="56.6" cy="4" r=".9"/><circle cx="56.6" cy="16" r=".9"/>
      <circle cx="58.6" cy="30" r="1"/><circle cx="56.6" cy="24" r=".9"/><circle cx="56.6" cy="36" r=".9"/>
      <circle cx="58.6" cy="50" r="1"/><circle cx="56.6" cy="44" r=".9"/><circle cx="56.6" cy="56" r=".9"/>
      <circle cx="58.6" cy="70" r="1"/><circle cx="56.6" cy="64" r=".9"/><circle cx="56.6" cy="76" r=".9"/>
    </g>
    <!-- eyelets inside scallops -->
    <g fill="#EDCFD7" stroke="#FFFFFF" stroke-width=".9">
      <circle cx="12" cy="10" r="1.7"/><circle cx="12" cy="30" r="1.7"/><circle cx="12" cy="50" r="1.7"/><circle cx="12" cy="70" r="1.7"/>
      <circle cx="52" cy="10" r="1.7"/><circle cx="52" cy="30" r="1.7"/><circle cx="52" cy="50" r="1.7"/><circle cx="52" cy="70" r="1.7"/>
    </g>
    <!-- center medallions: full flower at y=40, halves at y=0/80 join seamlessly -->
    <use href="#flower" x="32" y="40"/>
    <use href="#flower" x="32" y="0"/>
    <use href="#flower" x="32" y="80"/>
    <use href="#bud" x="32" y="20"/>
    <use href="#bud" x="32" y="60"/>
    <g fill="none" stroke="#FFFFFF" stroke-width=".8" opacity=".9">
      <path d="M24 12 Q20 20 24 28 M40 12 Q44 20 40 28 M24 52 Q20 60 24 68 M40 52 Q44 60 40 68"/>
    </g>
  </g>
</svg>
